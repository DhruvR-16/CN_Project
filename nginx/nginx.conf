events {
    worker_connections 1024;
}

http {
    upstream team1_backends {
        server 10.7.6.86:3001;
        server 10.7.6.96:3002;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate /Users/kavyajain/CN-Project-Team1/tls/server.crt;
        ssl_certificate_key /Users/kavyajain/CN-Project-Team1/tls/server.key;

        location / {
            proxy_pass http://team1_backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
